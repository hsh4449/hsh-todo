<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hsh · 프로젝트 대시보드</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-64 border-r border-zinc-800 flex flex-col">
    <div class="px-5 py-4 border-b border-zinc-800">
      <div class="text-xs text-zinc-500">hsh · 작업 대시보드</div>
      <div class="text-lg font-semibold mt-1">프로젝트</div>
    </div>
    <nav id="tab-nav" class="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1">
      <!-- tabs injected here -->
    </nav>
    <div class="p-3 border-t border-zinc-800 text-xs text-zinc-500">
      <button id="refresh-btn" class="w-full px-2 py-1.5 rounded hover:bg-zinc-800 text-left">↻ 새로고침</button>
      <div id="last-sync" class="px-2 pt-1.5 text-zinc-600"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0">
    <header class="border-b border-zinc-800 px-8 py-5 flex items-center justify-between sticky top-0 bg-zinc-950/80 backdrop-blur z-10">
      <div>
        <h1 id="page-title" class="text-2xl font-bold tracking-tight">메인</h1>
        <p id="page-subtitle" class="text-sm text-zinc-500 mt-0.5"></p>
      </div>
      <div class="flex gap-2">
        <button id="add-activity-btn" class="px-3 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">+ 작업 기록</button>
        <button id="add-idea-btn" class="px-3 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-sm font-medium">+ 구상</button>
      </div>
    </header>
    <div id="view" class="p-8 max-w-6xl"></div>
  </main>
</div>

<!-- Modal: Add Activity -->
<div id="modal-activity" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-lg w-full max-w-lg p-6">
    <h3 class="text-lg font-semibold mb-4">작업 기록 추가</h3>
    <form id="form-activity" class="space-y-3">
      <div>
        <label class="text-xs text-zinc-400">프로젝트</label>
        <select id="act-project" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1"></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-zinc-400">종류</label>
          <select id="act-kind" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1">
            <option value="work">work · 작업</option>
            <option value="feature">feature · 기능</option>
            <option value="bugfix">bugfix · 버그수정</option>
            <option value="commit">commit · 커밋</option>
            <option value="deploy">deploy · 배포</option>
            <option value="decision">decision · 결정</option>
            <option value="note">note · 메모</option>
            <option value="meeting">meeting · 미팅</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-zinc-400">발생 시각</label>
          <input id="act-occurred" type="datetime-local" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1"/>
        </div>
      </div>
      <div>
        <label class="text-xs text-zinc-400">제목</label>
        <input id="act-title" required class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1" placeholder="한 줄 요약"/>
      </div>
      <div>
        <label class="text-xs text-zinc-400">상세</label>
        <textarea id="act-detail" rows="4" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1" placeholder="자세한 내용 (옵션)"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="modal-close px-4 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-sm">취소</button>
        <button type="submit" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Add Idea -->
<div id="modal-idea" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-lg w-full max-w-lg p-6">
    <h3 class="text-lg font-semibold mb-4">구상 추가</h3>
    <form id="form-idea" class="space-y-3">
      <div>
        <label class="text-xs text-zinc-400">프로젝트</label>
        <select id="idea-project" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1"></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-zinc-400">상태</label>
          <select id="idea-status" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1">
            <option value="todo">todo · 할 일</option>
            <option value="doing">doing · 진행중</option>
            <option value="done">done · 완료</option>
            <option value="parked">parked · 보류</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-zinc-400">우선순위</label>
          <select id="idea-priority" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1">
            <option value="high">high · 높음</option>
            <option value="med" selected>med · 보통</option>
            <option value="low">low · 낮음</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs text-zinc-400">제목</label>
        <input id="idea-title" required class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1"/>
      </div>
      <div>
        <label class="text-xs text-zinc-400">내용</label>
        <textarea id="idea-content" rows="4" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1"></textarea>
      </div>
      <div>
        <label class="text-xs text-zinc-400">태그 (콤마 구분)</label>
        <input id="idea-tags" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1" placeholder="예: ui, api, refactor"/>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="modal-close px-4 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-sm">취소</button>
        <button type="submit" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">저장</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ---- Config ----
const SUPABASE_URL = 'https://iqyfzzaavqwxpahamenl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JJKK9Rx4J_sorue03cA3UQ_xiDQtRWC';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// IMPORTANT: 이 클라이언트는 dashboard_* 테이블에만 접근합니다.
// 같은 프로젝트의 stock_* 테이블은 SELECT조차 하지 않습니다 (사용자 정책).

// ---- State ----
const state = {
  currentTab: 'main',
  projects: [],
  activities: [],
  ideas: [],
};

// ---- Helpers ----
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const escapeHtml = s => (s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const fmtTime = ts => {
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  if (diff < 604800) return `${Math.floor(diff/86400)}일 전`;
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
};
const fmtFull = ts => new Date(ts).toLocaleString('ko-KR');
const localDatetimeNow = () => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
};
const kindBadge = k => {
  const map = {
    work:'bg-zinc-700', feature:'bg-emerald-700', bugfix:'bg-rose-700',
    commit:'bg-indigo-700', deploy:'bg-cyan-700', decision:'bg-amber-700',
    note:'bg-zinc-600', meeting:'bg-purple-700'
  };
  return `<span class="text-[10px] px-1.5 py-0.5 rounded ${map[k]||'bg-zinc-700'} text-zinc-100 uppercase">${k}</span>`;
};
const sourceBadge = s => {
  if (s === 'claude') return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-violet-900/60 text-violet-200">Claude</span>';
  if (s === 'git')    return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-orange-900/60 text-orange-200">git</span>';
  if (s === 'hook')   return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-pink-900/60 text-pink-200">hook</span>';
  return '';
};
const priorityBadge = p => {
  const map = { high:'bg-rose-600', med:'bg-amber-600', low:'bg-zinc-600' };
  return `<span class="text-[10px] px-1.5 py-0.5 rounded ${map[p]} text-white">${p}</span>`;
};
const statusBadge = s => {
  const map = { todo:'bg-zinc-700 text-zinc-300', doing:'bg-blue-700 text-blue-100', done:'bg-emerald-800 text-emerald-200', parked:'bg-zinc-800 text-zinc-500' };
  return `<span class="text-[10px] px-1.5 py-0.5 rounded ${map[s]}">${s}</span>`;
};

// ---- Data layer (dashboard_* tables only) ----
async function loadAll() {
  const [p, a, i] = await Promise.all([
    sb.from('dashboard_projects').select('*').order('sort_order'),
    sb.from('dashboard_activities').select('*').order('occurred_at', { ascending: false }).limit(500),
    sb.from('dashboard_ideas').select('*').order('priority').order('updated_at', { ascending: false }),
  ]);
  if (p.error || a.error || i.error) {
    alert('데이터 로드 실패: ' + (p.error?.message || a.error?.message || i.error?.message));
    return;
  }
  state.projects = p.data || [];
  state.activities = a.data || [];
  state.ideas = i.data || [];
  $('#last-sync').textContent = '동기화: ' + new Date().toLocaleTimeString('ko-KR');
}

async function insertActivity(payload) {
  const { error } = await sb.from('dashboard_activities').insert(payload);
  if (error) { alert('저장 실패: ' + error.message); return false; }
  return true;
}
async function insertIdea(payload) {
  const { error } = await sb.from('dashboard_ideas').insert(payload);
  if (error) { alert('저장 실패: ' + error.message); return false; }
  return true;
}
async function updateIdeaStatus(id, status) {
  const patch = { status };
  if (status === 'done') patch.done_at = new Date().toISOString();
  const { error } = await sb.from('dashboard_ideas').update(patch).eq('id', id);
  if (error) alert('업데이트 실패: ' + error.message);
}
async function moveIdeaToProject(id, projectId) {
  // 메인 inbox(project_id=null)에서 특정 프로젝트로, 또는 다른 프로젝트로 이동
  const { error } = await sb.from('dashboard_ideas').update({ project_id: projectId || null }).eq('id', id);
  if (error) { alert('이동 실패: ' + error.message); return; }
  await loadAll(); renderTabs(); render();
}
async function quickAddInboxNote(text) {
  // 메인 시트 빠른 메모 — 첫 줄을 title, 나머지를 content로
  const lines = text.split(/\r?\n/);
  const title = (lines.shift() || '').trim();
  const content = lines.join('\n').trim() || null;
  if (!title) return false;
  return await insertIdea({ project_id: null, title, content, status: 'todo', priority: 'med', tags: [] });
}
async function deleteActivity(id) {
  if (!confirm('이 작업기록을 삭제할까요?')) return;
  const { error } = await sb.from('dashboard_activities').delete().eq('id', id);
  if (error) return alert(error.message);
  await loadAll(); render();
}
async function deleteIdea(id) {
  if (!confirm('이 구상을 삭제할까요?')) return;
  const { error } = await sb.from('dashboard_ideas').delete().eq('id', id);
  if (error) return alert(error.message);
  await loadAll(); render();
}

window.__dash = { updateIdeaStatus, deleteActivity, deleteIdea, switchTab, moveIdeaToProject, quickAddInboxNote };

// ---- Tabs ----
function renderTabs() {
  const nav = $('#tab-nav');
  const items = [
    { slug: 'main', name: '📋 메인', color: '#a1a1aa', projectId: null },
    ...state.projects.map(p => ({ slug: p.slug, name: p.name, color: p.color, projectId: p.id })),
  ];
  nav.innerHTML = items.map(it => {
    const active = it.slug === state.currentTab;
    return `
      <button data-slug="${it.slug}" data-project-id="${it.projectId || ''}"
        class="tab-btn w-full text-left px-3 py-2 rounded text-sm flex items-center gap-2 transition-colors ${active ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200'}">
        <span class="w-2 h-2 rounded-full" style="background:${it.color}"></span>
        <span class="truncate">${escapeHtml(it.name)}</span>
      </button>
    `;
  }).join('');
  // 클릭 & 드롭 대상 등록
  nav.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.slug));
    btn.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('application/x-idea-id')) {
        e.preventDefault();
        btn.classList.add('ring-2','ring-indigo-500');
      }
    });
    btn.addEventListener('dragleave', () => btn.classList.remove('ring-2','ring-indigo-500'));
    btn.addEventListener('drop', async e => {
      e.preventDefault();
      btn.classList.remove('ring-2','ring-indigo-500');
      const id = e.dataTransfer.getData('application/x-idea-id');
      if (!id) return;
      await moveIdeaToProject(id, btn.dataset.projectId || null);
    });
  });
}

function switchTab(slug) {
  state.currentTab = slug;
  renderTabs();
  render();
}

// ---- Views ----
function render() {
  if (state.currentTab === 'main') return renderMain();
  const proj = state.projects.find(p => p.slug === state.currentTab);
  if (!proj) return renderMain();
  return renderProject(proj);
}

function renderMain() {
  $('#page-title').textContent = '메인 시트';
  $('#page-subtitle').textContent = `${state.projects.length}개 프로젝트 · 활동 ${state.activities.length}건 · 구상 ${state.ideas.filter(i=>i.status!=='done').length}건 진행중`;

  const recent = state.activities.slice(0, 10);
  const inbox = state.ideas.filter(i => !i.project_id && i.status !== 'done' && i.status !== 'parked');
  const hotIdeas = state.ideas.filter(i => i.status !== 'done' && i.status !== 'parked')
    .sort((a,b) => ({high:0,med:1,low:2}[a.priority] - {high:0,med:1,low:2}[b.priority])).slice(0, 8);

  $('#view').innerHTML = `
    <!-- Quick inbox -->
    <section class="mb-10">
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">📥 빠른 메모 <span class="text-zinc-600 font-normal text-xs ml-2">두서없이 적고 → 사이드바 프로젝트로 드래그</span></h2>
      <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 mb-3">
        <textarea id="quick-note" rows="2" placeholder="첫 줄은 제목, 다음 줄부터는 내용. Ctrl+Enter 저장."
          class="w-full bg-transparent text-sm outline-none resize-none placeholder:text-zinc-600"></textarea>
        <div class="flex justify-between items-center mt-1">
          <div class="text-[11px] text-zinc-600">Ctrl + Enter</div>
          <button id="quick-note-save" class="px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-xs">저장</button>
        </div>
      </div>
      ${inbox.length === 0
        ? '<p class="text-xs text-zinc-600">받은 메모 없음.</p>'
        : `<div id="inbox-list" class="flex flex-wrap gap-2">
            ${inbox.map(i => `
              <div draggable="true" data-id="${i.id}" class="inbox-chip group cursor-grab active:cursor-grabbing bg-zinc-900 border border-zinc-800 hover:border-indigo-500 rounded px-3 py-2 text-sm max-w-md">
                <div class="flex items-start gap-2">
                  <span class="text-zinc-600 text-xs mt-0.5">⠿</span>
                  <div class="flex-1 min-w-0">
                    <div class="font-medium truncate">${escapeHtml(i.title)}</div>
                    ${i.content ? `<div class="text-xs text-zinc-500 line-clamp-2 mt-0.5 whitespace-pre-wrap">${escapeHtml(i.content)}</div>` : ''}
                  </div>
                  <button onclick="event.stopPropagation();__dash.deleteIdea('${i.id}')" class="text-[10px] text-zinc-700 hover:text-rose-400 opacity-0 group-hover:opacity-100">✕</button>
                </div>
              </div>
            `).join('')}
          </div>`}
    </section>

    <!-- Project cards -->
    <section class="mb-10">
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">프로젝트</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        ${state.projects.map(p => {
          const pActs = state.activities.filter(a => a.project_id === p.id);
          const pIdeas = state.ideas.filter(i => i.project_id === p.id && i.status !== 'done');
          return `
            <div onclick="__dash.switchTab('${p.slug}')" class="bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-lg p-4 cursor-pointer">
              <div class="flex items-center gap-2 mb-2">
                <span class="w-2.5 h-2.5 rounded-full" style="background:${p.color}"></span>
                <h3 class="font-semibold flex-1 truncate">${escapeHtml(p.name)}</h3>
                ${statusBadge(p.status)}
              </div>
              <p class="text-xs text-zinc-500 line-clamp-2 min-h-[2.5rem]">${escapeHtml(p.description||'')}</p>
              <p class="text-[11px] text-zinc-600 mt-2">${escapeHtml(p.tech_stack||'')}</p>
              <div class="flex gap-4 mt-3 text-xs text-zinc-400">
                <span>📝 ${pActs.length}</span>
                <span>💡 ${pIdeas.length}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>

    <!-- Recent activities -->
    <section class="mb-10">
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">최근 활동</h2>
      ${recent.length === 0 ? '<p class="text-sm text-zinc-600">아직 기록이 없습니다.</p>' : ''}
      <div class="space-y-1.5">
        ${recent.map(a => renderActivityRow(a, true)).join('')}
      </div>
    </section>

    <!-- Hot ideas -->
    <section>
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">우선 구상</h2>
      ${hotIdeas.length === 0 ? '<p class="text-sm text-zinc-600">구상 항목 없음.</p>' : ''}
      <div class="space-y-1.5">
        ${hotIdeas.map(i => renderIdeaRow(i, true)).join('')}
      </div>
    </section>
  `;
}

function renderProject(p) {
  $('#page-title').innerHTML = `<span class="inline-block w-3 h-3 rounded-full mr-2" style="background:${p.color}"></span>${escapeHtml(p.name)}`;
  $('#page-subtitle').textContent = p.description || '';

  const acts = state.activities.filter(a => a.project_id === p.id);
  const ideas = state.ideas.filter(i => i.project_id === p.id);
  const cols = ['todo','doing','done','parked'];

  $('#view').innerHTML = `
    <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
      <div class="bg-zinc-900 border border-zinc-800 rounded p-4">
        <div class="text-xs text-zinc-500 mb-1">로컬 경로</div>
        <div class="font-mono text-zinc-300 text-xs break-all">${escapeHtml(p.local_path||'-')}</div>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 rounded p-4">
        <div class="text-xs text-zinc-500 mb-1">레포지토리</div>
        <div class="font-mono text-zinc-300 text-xs break-all">
          ${p.repo_url ? `<a href="${escapeHtml(p.repo_url)}" target="_blank" class="text-indigo-400 hover:underline">${escapeHtml(p.repo_url)}</a>` : '-'}
        </div>
      </div>
    </div>

    <!-- Ideas Kanban -->
    <section class="mb-10">
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">구상 (${ideas.length})</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        ${cols.map(col => {
          const items = ideas.filter(i => i.status === col);
          return `
            <div class="bg-zinc-900/50 border border-zinc-800 rounded p-3 min-h-[120px]">
              <div class="text-xs font-semibold text-zinc-400 mb-2 uppercase">${col} · ${items.length}</div>
              <div class="space-y-2">
                ${items.map(i => `
                  <div class="bg-zinc-900 border border-zinc-800 rounded p-2.5 text-sm">
                    <div class="flex items-start justify-between gap-2">
                      <div class="font-medium leading-tight flex-1">${escapeHtml(i.title)}</div>
                      ${priorityBadge(i.priority)}
                    </div>
                    ${i.content ? `<div class="text-xs text-zinc-500 mt-1.5 whitespace-pre-wrap">${escapeHtml(i.content)}</div>` : ''}
                    ${(i.tags||[]).length ? `<div class="flex flex-wrap gap-1 mt-2">${i.tags.map(t=>`<span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                    <div class="flex items-center justify-between gap-1 mt-2 pt-2 border-t border-zinc-800">
                      <select onchange="__dash.updateIdeaStatus('${i.id}', this.value).then(()=>location.reload())" class="text-[10px] bg-zinc-800 border border-zinc-700 rounded px-1 py-0.5">
                        ${cols.map(c => `<option value="${c}" ${c===i.status?'selected':''}>${c}</option>`).join('')}
                      </select>
                      <button onclick="__dash.deleteIdea('${i.id}')" class="text-[10px] text-zinc-600 hover:text-rose-400">삭제</button>
                    </div>
                  </div>
                `).join('') || '<div class="text-xs text-zinc-700">없음</div>'}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>

    <!-- Activities log -->
    <section>
      <h2 class="text-sm font-semibold text-zinc-400 mb-3">작업 기록 (${acts.length})</h2>
      ${acts.length === 0 ? '<p class="text-sm text-zinc-600">아직 기록이 없습니다.</p>' : ''}
      <div class="space-y-1.5">
        ${acts.map(a => renderActivityRow(a, false)).join('')}
      </div>
    </section>
  `;
}

function renderActivityRow(a, showProject) {
  const proj = state.projects.find(p => p.id === a.project_id);
  return `
    <details class="group bg-zinc-900/40 hover:bg-zinc-900 border border-zinc-800 rounded">
      <summary class="px-3 py-2 flex items-center gap-2 text-sm">
        ${kindBadge(a.kind)}
        ${sourceBadge(a.source)}
        ${showProject ? (proj ? `<span class="text-[11px] text-zinc-500"><span class="inline-block w-1.5 h-1.5 rounded-full mr-1" style="background:${proj.color}"></span>${escapeHtml(proj.name)}</span>` : '<span class="text-[11px] text-zinc-600">· 공통</span>') : ''}
        <span class="flex-1 truncate">${escapeHtml(a.title)}</span>
        <span class="text-xs text-zinc-500 shrink-0" title="${fmtFull(a.occurred_at)}">${fmtTime(a.occurred_at)}</span>
      </summary>
      ${a.detail || a.cwd ? `
        <div class="px-3 pb-3 pt-1 text-sm text-zinc-300 border-t border-zinc-800/60">
          ${a.detail ? `<pre class="whitespace-pre-wrap font-sans text-zinc-300 text-[13px]">${escapeHtml(a.detail)}</pre>` : ''}
          ${a.cwd ? `<div class="mt-2 text-[11px] text-zinc-500 font-mono">cwd: ${escapeHtml(a.cwd)}</div>` : ''}
          <div class="mt-2 text-right">
            <button onclick="__dash.deleteActivity('${a.id}')" class="text-[11px] text-zinc-600 hover:text-rose-400">삭제</button>
          </div>
        </div>
      ` : `<div class="px-3 pb-2 text-right"><button onclick="__dash.deleteActivity('${a.id}')" class="text-[11px] text-zinc-600 hover:text-rose-400">삭제</button></div>`}
    </details>
  `;
}

function renderIdeaRow(i, showProject) {
  const proj = state.projects.find(p => p.id === i.project_id);
  return `
    <div class="px-3 py-2 bg-zinc-900/40 border border-zinc-800 rounded flex items-center gap-2 text-sm">
      ${priorityBadge(i.priority)}
      ${statusBadge(i.status)}
      ${showProject ? (proj ? `<span class="text-[11px] text-zinc-500"><span class="inline-block w-1.5 h-1.5 rounded-full mr-1" style="background:${proj.color}"></span>${escapeHtml(proj.name)}</span>` : '') : ''}
      <span class="flex-1 truncate">${escapeHtml(i.title)}</span>
    </div>
  `;
}

// ---- Forms ----
function fillProjectSelect(sel) {
  const el = $(sel);
  el.innerHTML = `<option value="">(공통 / 메인)</option>` + state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  // preselect current tab if a project
  const cur = state.projects.find(p => p.slug === state.currentTab);
  if (cur) el.value = cur.id;
}

function openModal(id) {
  $('#'+id).classList.remove('hidden');
}
function closeModal(id) {
  $('#'+id).classList.add('hidden');
}

$('#add-activity-btn').addEventListener('click', () => {
  fillProjectSelect('#act-project');
  $('#act-occurred').value = localDatetimeNow();
  $('#act-title').value = '';
  $('#act-detail').value = '';
  $('#act-kind').value = 'work';
  openModal('modal-activity');
});

$('#add-idea-btn').addEventListener('click', () => {
  fillProjectSelect('#idea-project');
  $('#idea-title').value = '';
  $('#idea-content').value = '';
  $('#idea-tags').value = '';
  $('#idea-status').value = 'todo';
  $('#idea-priority').value = 'med';
  openModal('modal-idea');
});

$$('.modal-close').forEach(b => b.addEventListener('click', e => {
  e.target.closest('[id^=modal-]').classList.add('hidden');
}));

$('#form-activity').addEventListener('submit', async e => {
  e.preventDefault();
  const occurred = $('#act-occurred').value;
  const ok = await insertActivity({
    project_id: $('#act-project').value || null,
    kind: $('#act-kind').value,
    title: $('#act-title').value.trim(),
    detail: $('#act-detail').value.trim() || null,
    occurred_at: occurred ? new Date(occurred).toISOString() : new Date().toISOString(),
    source: 'manual',
  });
  if (ok) { closeModal('modal-activity'); await loadAll(); render(); }
});

$('#form-idea').addEventListener('submit', async e => {
  e.preventDefault();
  const tags = $('#idea-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const ok = await insertIdea({
    project_id: $('#idea-project').value || null,
    title: $('#idea-title').value.trim(),
    content: $('#idea-content').value.trim() || null,
    status: $('#idea-status').value,
    priority: $('#idea-priority').value,
    tags,
  });
  if (ok) { closeModal('modal-idea'); await loadAll(); render(); }
});

$('#refresh-btn').addEventListener('click', async () => { await loadAll(); renderTabs(); render(); });

// inbox 입력 / 드래그 — 메인 시트가 render될 때마다 다시 바인딩
document.addEventListener('click', async e => {
  if (e.target && e.target.id === 'quick-note-save') {
    const ta = document.getElementById('quick-note');
    if (!ta) return;
    const text = ta.value;
    if (!text.trim()) return;
    const ok = await quickAddInboxNote(text);
    if (ok) { ta.value = ''; await loadAll(); render(); }
  }
});
document.addEventListener('keydown', async e => {
  if (e.target && e.target.id === 'quick-note' && (e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    const text = e.target.value;
    if (!text.trim()) return;
    const ok = await quickAddInboxNote(text);
    if (ok) { e.target.value = ''; await loadAll(); render(); }
  }
});
document.addEventListener('dragstart', e => {
  const chip = e.target.closest && e.target.closest('.inbox-chip');
  if (!chip) return;
  e.dataTransfer.setData('application/x-idea-id', chip.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  chip.classList.add('opacity-50');
});
document.addEventListener('dragend', e => {
  const chip = e.target.closest && e.target.closest('.inbox-chip');
  if (chip) chip.classList.remove('opacity-50');
});

// ---- Boot ----
(async () => {
  await loadAll();
  renderTabs();
  render();
  // 30초마다 자동 새로고침 (Claude Stop hook 등 외부 기록 반영)
  // 사이드바 탭도 새로 그려야 함 — 프로젝트 이름이 DB에서 바뀐 경우 반영
  setInterval(async () => { await loadAll(); renderTabs(); render(); }, 30000);
})();
</script>
</body>
</html>
