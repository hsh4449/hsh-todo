<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hsh · GitHub 대시보드</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<header class="border-b border-zinc-800 sticky top-0 bg-zinc-950/90 backdrop-blur z-10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
    <div class="flex-1 min-w-0">
      <div class="text-xs text-zinc-500">hsh · GitHub 대시보드</div>
      <h1 class="text-xl font-semibold">레포지토리</h1>
    </div>
    <div id="status" class="text-xs text-zinc-500 mr-2 truncate"></div>
    <label class="flex items-center gap-1.5 text-xs text-zinc-400 cursor-pointer select-none">
      <input id="show-archived" type="checkbox" class="accent-indigo-500"> archived/hidden 포함
    </label>
    <button id="sync-btn" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">↻ 동기화</button>
    <button id="tokens-btn" class="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 text-sm">🔑 토큰</button>
  </div>
</header>

<main id="view" class="max-w-7xl mx-auto px-6 py-6">
  <p class="text-sm text-zinc-500">로딩 중...</p>
</main>

<!-- Modal: Tokens -->
<div id="modal-tokens" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-lg w-full max-w-lg p-6">
    <h3 class="text-lg font-semibold mb-1">API 토큰 설정</h3>
    <p class="text-xs text-zinc-500 mb-4">Supabase <code>dashboard_secrets</code>에 저장. anon 키 노출 시 토큰도 노출되니 hsh-todo 레포는 public이어도 토큰값만 별도 관리.</p>
    <form id="form-tokens" class="space-y-3">
      <div>
        <label class="text-xs text-zinc-400 flex justify-between">
          <span>GitHub PAT <span class="text-zinc-600">(scope: repo, read:user)</span></span>
          <a href="https://github.com/settings/tokens/new?scopes=repo,read:user&description=hsh-todo-dashboard" target="_blank" class="text-indigo-400 hover:underline">발급 →</a>
        </label>
        <input id="tk-gh" type="password" autocomplete="off" placeholder="ghp_..." class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1 font-mono text-sm"/>
      </div>
      <div>
        <label class="text-xs text-zinc-400 flex justify-between">
          <span>Netlify PAT</span>
          <a href="https://app.netlify.com/user/applications#personal-access-tokens" target="_blank" class="text-indigo-400 hover:underline">발급 →</a>
        </label>
        <input id="tk-nl" type="password" autocomplete="off" placeholder="nfp_..." class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 mt-1 font-mono text-sm"/>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="tokens-cancel" class="px-4 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-sm">취소</button>
        <button type="submit" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Note -->
<div id="modal-note" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-lg w-full max-w-lg p-6">
    <h3 class="text-lg font-semibold mb-1">메모</h3>
    <p id="note-repo" class="text-xs text-zinc-500 mb-3"></p>
    <form id="form-note" class="space-y-3">
      <textarea id="note-text" rows="6" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm" placeholder="레포에 대한 메모 (배포 URL 메모, 작업 컨텍스트 등)"></textarea>
      <div class="flex justify-end gap-2">
        <button type="button" id="note-cancel" class="px-4 py-2 rounded bg-zinc-800 hover:bg-zinc-700 text-sm">취소</button>
        <button type="submit" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">저장</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://iqyfzzaavqwxpahamenl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JJKK9Rx4J_sorue03cA3UQ_xiDQtRWC';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  repos: [],
  tokens: { github_pat: '', netlify_pat: '' },
  showArchived: false,
  noteRepoId: null,
};

const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const setStatus = t => { $('#status').textContent = t || ''; };
const fmtTime = ts => {
  if (!ts) return '';
  const d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  if (diff < 604800) return `${Math.floor(diff/86400)}일 전`;
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
};
const fmtFull = ts => ts ? new Date(ts).toLocaleString('ko-KR') : '';

// ---- Tokens ----
async function loadTokens() {
  const { data, error } = await sb.from('dashboard_secrets').select('*');
  if (error) { console.error(error); return; }
  state.tokens = { github_pat: '', netlify_pat: '' };
  (data || []).forEach(r => { state.tokens[r.key] = r.value; });
}
async function saveTokens(gh, nl) {
  const rows = [];
  if (gh) rows.push({ key: 'github_pat', value: gh, updated_at: new Date().toISOString() });
  if (nl) rows.push({ key: 'netlify_pat', value: nl, updated_at: new Date().toISOString() });
  if (!rows.length) return;
  const { error } = await sb.from('dashboard_secrets').upsert(rows, { onConflict: 'key' });
  if (error) { alert('토큰 저장 실패: ' + error.message); return false; }
  await loadTokens();
  return true;
}

// ---- Repos cache ----
async function loadRepos() {
  const { data, error } = await sb.from('gh_repos').select('*')
    .order('pinned', { ascending: false })
    .order('pushed_at', { ascending: false, nullsFirst: false });
  if (error) { alert('레포 로드 실패: ' + error.message); return; }
  state.repos = data || [];
}

// ---- GitHub API ----
async function gh(path, token) {
  const r = await fetch(`https://api.github.com${path}`, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });
  if (!r.ok) throw new Error(`GitHub ${path}: ${r.status} ${r.statusText}`);
  return r.json();
}

async function fetchAllGhRepos(token) {
  // affiliation=owner: 본인 소유 레포만 (collaborator 레포 제외)
  let page = 1, all = [];
  while (page < 10) {
    const items = await gh(`/user/repos?per_page=100&affiliation=owner&sort=pushed&page=${page}`, token);
    if (!items.length) break;
    all = all.concat(items);
    if (items.length < 100) break;
    page++;
  }
  return all;
}

async function fetchLatestCommit(fullName, branch, token) {
  try {
    const items = await gh(`/repos/${fullName}/commits?per_page=1&sha=${encodeURIComponent(branch)}`, token);
    if (!items.length) return null;
    const c = items[0];
    return {
      sha: c.sha,
      message: (c.commit?.message || '').split('\n')[0].slice(0, 200),
      at: c.commit?.author?.date || c.commit?.committer?.date,
      author: c.commit?.author?.name || c.author?.login || '',
    };
  } catch (e) {
    console.warn('commit fetch fail', fullName, e.message);
    return null;
  }
}

async function fetchOpenPrCount(fullName, token) {
  try {
    const items = await gh(`/repos/${fullName}/pulls?state=open&per_page=100`, token);
    return items.length;
  } catch (e) {
    return 0;
  }
}

// ---- Netlify API ----
async function fetchNetlifySites(token) {
  const r = await fetch('https://api.netlify.com/api/v1/sites?per_page=100', {
    headers: { 'Authorization': `Bearer ${token}` },
  });
  if (!r.ok) throw new Error(`Netlify: ${r.status} ${r.statusText}`);
  return r.json();
}

function matchNetlifyByRepo(sites, fullName) {
  // Netlify site.build_settings.repo_url 또는 repo 객체에 GitHub URL
  const target = fullName.toLowerCase();
  return sites.find(s => {
    const url = (s.build_settings?.repo_url || '').toLowerCase();
    return url.endsWith(`/${target}`) || url.endsWith(`/${target}.git`);
  });
}

// ---- Sync ----
async function sync() {
  const { github_pat, netlify_pat } = state.tokens;
  if (!github_pat) {
    alert('GitHub 토큰이 없습니다. 🔑 토큰 버튼으로 입력하세요.');
    openTokens();
    return;
  }
  $('#sync-btn').disabled = true;
  try {
    setStatus('GitHub 레포 목록 가져오는 중...');
    const ghRepos = await fetchAllGhRepos(github_pat);

    setStatus(`최근 커밋/PR 가져오는 중... (${ghRepos.length}개)`);
    const enriched = await Promise.all(ghRepos.map(async r => {
      const [commit, prCount] = await Promise.all([
        fetchLatestCommit(r.full_name, r.default_branch || 'main', github_pat),
        fetchOpenPrCount(r.full_name, github_pat),
      ]);
      return { r, commit, prCount };
    }));

    let netlifySites = [];
    if (netlify_pat) {
      try {
        setStatus('Netlify 사이트 매칭 중...');
        netlifySites = await fetchNetlifySites(netlify_pat);
      } catch (e) {
        console.warn(e);
        setStatus('Netlify 호출 실패 — 토큰 확인 필요');
      }
    }

    const existing = Object.fromEntries(state.repos.map(r => [r.id, r]));
    const rows = enriched.map(({ r, commit, prCount }) => {
      const nl = netlify_pat ? matchNetlifyByRepo(netlifySites, r.full_name) : null;
      const prev = existing[r.id] || {};
      return {
        id: r.id,
        name: r.name,
        full_name: r.full_name,
        description: r.description,
        html_url: r.html_url,
        default_branch: r.default_branch,
        private: r.private,
        archived: r.archived,
        fork: r.fork,
        language: r.language,
        pushed_at: r.pushed_at,
        open_issues_count: r.open_issues_count,
        open_pr_count: prCount,
        last_commit_sha: commit?.sha || null,
        last_commit_message: commit?.message || null,
        last_commit_at: commit?.at || null,
        last_commit_author: commit?.author || null,
        netlify_site_id: nl?.id || null,
        netlify_site_name: nl?.name || null,
        netlify_url: nl?.ssl_url || nl?.url || null,
        netlify_state: nl?.published_deploy?.state || nl?.state || null,
        netlify_deploy_at: nl?.published_deploy?.published_at || nl?.published_deploy?.created_at || null,
        netlify_deploy_url: nl?.published_deploy?.deploy_ssl_url || nl?.published_deploy?.deploy_url || null,
        // user-managed flags 유지
        pinned: prev.pinned || false,
        hidden: prev.hidden || false,
        note: prev.note || null,
        synced_at: new Date().toISOString(),
      };
    });

    setStatus('DB 저장 중...');
    const { error } = await sb.from('gh_repos').upsert(rows, { onConflict: 'id' });
    if (error) throw new Error('DB upsert: ' + error.message);

    // GitHub에서 사라진 레포는 DB에서도 제거 (id 비교)
    const liveIds = new Set(rows.map(r => r.id));
    const stale = state.repos.filter(r => !liveIds.has(r.id)).map(r => r.id);
    if (stale.length) {
      await sb.from('gh_repos').delete().in('id', stale);
    }

    await loadRepos();
    render();
    setStatus(`동기화 완료 · ${rows.length}개 · ${new Date().toLocaleTimeString('ko-KR')}`);
  } catch (e) {
    console.error(e);
    alert('동기화 실패: ' + e.message);
    setStatus('동기화 실패');
  } finally {
    $('#sync-btn').disabled = false;
  }
}

// ---- Actions ----
async function togglePin(id) {
  const r = state.repos.find(x => x.id == id);
  if (!r) return;
  await sb.from('gh_repos').update({ pinned: !r.pinned }).eq('id', id);
  await loadRepos(); render();
}
async function toggleHide(id) {
  const r = state.repos.find(x => x.id == id);
  if (!r) return;
  await sb.from('gh_repos').update({ hidden: !r.hidden }).eq('id', id);
  await loadRepos(); render();
}
async function saveNote(id, text) {
  await sb.from('gh_repos').update({ note: text || null }).eq('id', id);
  await loadRepos(); render();
}
window.__d = { togglePin, toggleHide, openNote };

function openNote(id) {
  const r = state.repos.find(x => x.id == id);
  if (!r) return;
  state.noteRepoId = id;
  $('#note-repo').textContent = r.full_name;
  $('#note-text').value = r.note || '';
  $('#modal-note').classList.remove('hidden');
}

// ---- Render ----
function netlifyBadge(s) {
  if (!s) return '';
  const map = {
    ready: 'bg-emerald-700 text-emerald-100',
    building: 'bg-amber-700 text-amber-100',
    error: 'bg-rose-700 text-rose-100',
    enqueued: 'bg-amber-700 text-amber-100',
    processing: 'bg-amber-700 text-amber-100',
    new: 'bg-zinc-700 text-zinc-200',
  };
  return `<span class="text-[10px] px-1.5 py-0.5 rounded ${map[s]||'bg-zinc-700'}">${esc(s)}</span>`;
}

function repoCard(r) {
  const stale = r.last_commit_at && (Date.now() - new Date(r.last_commit_at).getTime()) > 90 * 86400000;
  return `
    <div class="bg-zinc-900 border ${r.pinned ? 'border-indigo-700' : 'border-zinc-800'} hover:border-zinc-700 rounded-lg p-4 flex flex-col gap-3 ${r.hidden ? 'opacity-50' : ''}">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <a href="${esc(r.html_url)}" target="_blank" class="font-semibold hover:text-indigo-400 truncate">${esc(r.name)}</a>
            ${r.private ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700">private</span>' : ''}
            ${r.archived ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-900/40 text-amber-300">archived</span>' : ''}
            ${r.fork ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-500">fork</span>' : ''}
            ${r.language ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400">${esc(r.language)}</span>` : ''}
          </div>
          <p class="text-xs text-zinc-500 line-clamp-2 mt-1 min-h-[2rem]">${esc(r.description || '')}</p>
        </div>
        <div class="flex flex-col gap-1 items-end shrink-0">
          <button onclick="__d.togglePin(${r.id})" title="고정 토글" class="text-xs ${r.pinned ? 'text-indigo-400' : 'text-zinc-600 hover:text-zinc-300'}">${r.pinned ? '★' : '☆'}</button>
          <button onclick="__d.toggleHide(${r.id})" title="숨김 토글" class="text-xs ${r.hidden ? 'text-zinc-500' : 'text-zinc-600 hover:text-zinc-300'}">${r.hidden ? '◐' : '○'}</button>
        </div>
      </div>

      <div class="text-xs text-zinc-400 border-t border-zinc-800 pt-3 space-y-1.5">
        ${r.last_commit_message ? `
          <div class="flex items-start gap-2">
            <span class="text-zinc-600 shrink-0">⌖</span>
            <div class="flex-1 min-w-0">
              <div class="text-zinc-300 truncate" title="${esc(r.last_commit_message)}">${esc(r.last_commit_message)}</div>
              <div class="text-[11px] text-zinc-500 mt-0.5">
                ${esc(r.last_commit_author || '')} · <span title="${fmtFull(r.last_commit_at)}" class="${stale ? 'text-amber-400' : ''}">${fmtTime(r.last_commit_at)}</span>
              </div>
            </div>
          </div>
        ` : '<div class="text-zinc-600 italic">커밋 없음</div>'}

        <div class="flex items-center gap-3 text-[11px] pt-1">
          <a href="${esc(r.html_url)}/issues" target="_blank" class="text-zinc-400 hover:text-indigo-400">⊙ 이슈 ${r.open_issues_count - r.open_pr_count}</a>
          <a href="${esc(r.html_url)}/pulls" target="_blank" class="text-zinc-400 hover:text-indigo-400">⇄ PR ${r.open_pr_count}</a>
          <span class="text-zinc-600">·</span>
          <span class="text-zinc-500">${esc(r.default_branch || '')}</span>
        </div>
      </div>

      ${r.netlify_url ? `
        <div class="text-xs border-t border-zinc-800 pt-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-zinc-500">Netlify</span>
            ${netlifyBadge(r.netlify_state)}
            <a href="${esc(r.netlify_url)}" target="_blank" class="text-indigo-400 hover:underline truncate flex-1 min-w-0">${esc(r.netlify_url.replace(/^https?:\/\//, ''))}</a>
          </div>
          ${r.netlify_deploy_at ? `<div class="text-[11px] text-zinc-600 mt-0.5">배포 ${fmtTime(r.netlify_deploy_at)}</div>` : ''}
        </div>
      ` : ''}

      ${r.note ? `
        <div class="text-xs border-t border-zinc-800 pt-3 whitespace-pre-wrap text-zinc-400">${esc(r.note)}</div>
      ` : ''}

      <div class="flex justify-end mt-auto">
        <button onclick="__d.openNote(${r.id})" class="text-[11px] text-zinc-600 hover:text-zinc-300">메모 ${r.note ? '✎' : '+'}</button>
      </div>
    </div>
  `;
}

function render() {
  const visible = state.repos.filter(r => state.showArchived || (!r.archived && !r.hidden));
  if (state.repos.length === 0) {
    $('#view').innerHTML = `
      <div class="text-center py-20">
        <p class="text-zinc-500 mb-4">아직 동기화된 레포가 없습니다.</p>
        <p class="text-zinc-600 text-sm mb-6">우상단 🔑 토큰을 먼저 입력한 뒤 ↻ 동기화를 누르세요.</p>
      </div>
    `;
    return;
  }
  $('#view').innerHTML = `
    <div class="text-xs text-zinc-500 mb-4">전체 ${state.repos.length}개 · 표시 ${visible.length}개${state.repos.find(r=>r.synced_at) ? ` · 마지막 동기화 ${fmtTime(state.repos[0]?.synced_at)}` : ''}</div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${visible.map(repoCard).join('')}
    </div>
  `;
}

// ---- Modal: tokens ----
function openTokens() {
  $('#tk-gh').value = state.tokens.github_pat || '';
  $('#tk-nl').value = state.tokens.netlify_pat || '';
  $('#modal-tokens').classList.remove('hidden');
}
$('#tokens-btn').addEventListener('click', openTokens);
$('#tokens-cancel').addEventListener('click', () => $('#modal-tokens').classList.add('hidden'));
$('#form-tokens').addEventListener('submit', async e => {
  e.preventDefault();
  const gh = $('#tk-gh').value.trim();
  const nl = $('#tk-nl').value.trim();
  const ok = await saveTokens(gh, nl);
  if (ok) {
    $('#modal-tokens').classList.add('hidden');
    setStatus('토큰 저장됨');
  }
});

// ---- Modal: note ----
$('#note-cancel').addEventListener('click', () => $('#modal-note').classList.add('hidden'));
$('#form-note').addEventListener('submit', async e => {
  e.preventDefault();
  if (!state.noteRepoId) return;
  await saveNote(state.noteRepoId, $('#note-text').value.trim());
  $('#modal-note').classList.add('hidden');
});

$('#sync-btn').addEventListener('click', sync);
$('#show-archived').addEventListener('change', e => {
  state.showArchived = e.target.checked;
  render();
});

// ---- Boot ----
(async () => {
  await loadTokens();
  await loadRepos();
  render();
  if (!state.tokens.github_pat) {
    setStatus('GitHub 토큰을 먼저 설정하세요');
  } else if (state.repos.length === 0) {
    setStatus('동기화 버튼을 눌러 시작하세요');
  } else {
    setStatus(`${state.repos.length}개 레포 로드됨`);
  }
})();
</script>
</body>
</html>
